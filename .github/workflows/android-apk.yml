name: Penalty Kings Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'penalty-kings/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze and build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: penalty-kings
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform project if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.deeprows .
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: penalty-kings-android-apk
          path: penalty-kings/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
