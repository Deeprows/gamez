name: Import Penalty Kings archive

on:
  push:
    paths:
      - penalty-kings-source.zip.b64

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project files
        run: |
          cat penalty-kings-source.part-* > /tmp/penalty-kings-source.zip.b64
          base64 -d /tmp/penalty-kings-source.zip.b64 > /tmp/penalty-kings.zip
          unzip -o -q /tmp/penalty-kings.zip -d .
          rm penalty-kings-source.zip.b64 penalty-kings-source.part-*
          rm .github/workflows/import-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload Penalty Kings Flutter project v3.0"
          git push
